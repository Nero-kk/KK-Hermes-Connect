[project]
name = "kk-hermes-bridge"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = ["aiohttp>=3.12,<4", "anyio>=4.10,<5", "pydantic>=2.12,<3", "typer>=0.20,<1"]

[project.scripts]
kk-hermes-bridge = "kk_bridge.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["kk_bridge"]

[dependency-groups]
dev = ["pytest>=8", "pytest-anyio", "httpx>=0.28", "ruff>=0.14", "basedpyright>=1.30"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "ASYNC"]
